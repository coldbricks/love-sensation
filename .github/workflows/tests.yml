name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux Qt Multimedia runtime
        if: runner.os == 'Linux'
        # QtMultimedia links audio and graphics libraries even with fake players.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 libegl1 libgl1 libxkbcommon0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install synthetic-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Confirm CPU runner and dependency consistency
        run: |
          python -m pip check
          python -c "import torch, torchvision; print({'torch': torch.__version__, 'torchvision': torchvision.__version__, 'cuda_available': torch.cuda.is_available()}); assert torch.version.cuda is None"
          python -c "from PySide6.QtMultimedia import QMediaPlayer; print('Qt Multimedia import ready; audio playback is not started.')"
      - name: Parse Windows setup without running installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setupTokens = $null
          $setupErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Setup.ps1'), [ref]$setupTokens, [ref]$setupErrors) | Out-Null
          if ($setupErrors.Count) { throw ($setupErrors | Out-String) }
      - name: Compile application source
        run: python -m compileall -q main.py platinum_sorter tests
      - name: Run synthetic tests
        # No model download, user images, Qt window, or GPU benchmark in CI.
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
